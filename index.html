<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check-in Streak</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0b0812;
  --card:#181324;
  --tx:#f4eefc;
  --mu:#9a8fb0;
  --ac:#ff9a1f;
  --c1:#555;
  --c2:#444;
  --c3:#333;
  --glow:rgba(255,255,255,0)
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at 50% 30%,var(--glow),transparent 65%),var(--bg);
  color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;
  justify-content:center;
  transition:background .8s ease;
  user-select:none;
}
main{width:100%;max-width:420px;padding:24px 18px 40px;text-align:center}
h1{font-size:20px;margin:0 0 4px;letter-spacing:.5px;font-weight:800}
.sub{color:var(--mu);font-size:13px;margin:0 0 8px}
.fire{position:relative;width:150px;height:190px;margin:10px auto 0;transform-origin:50% 100%;transition:transform .8s cubic-bezier(0.175, 0.885, 0.32, 1.275)}
.fire svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 22px var(--c1))}
.fire stop{transition:stop-color .8s}
.f{transform-origin:50px 126px}
.f1{animation:fl 1.6s ease-in-out infinite}
.f2{animation:fl 1.2s ease-in-out infinite .15s}
.f3{animation:fl .9s ease-in-out infinite .3s}
@keyframes fl{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.96,1.07) skewX(4deg)}60%{transform:scale(1.03,.95) skewX(-4deg)}}
.dead .f{animation:none}
.dead svg{filter:none}
.spark{position:absolute;bottom:40%;left:50%;width:6px;height:6px;border-radius:50%;background:var(--c3);opacity:0;animation:up 2.2s linear infinite}
@keyframes up{0%{transform:translate(0,0) scale(1);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-150px) scale(0.2);opacity:0}}
.smoke{position:absolute;bottom:20%;left:50%;width:30px;height:30px;border-radius:50%;background:#554e63;opacity:0;filter:blur(8px);animation:sm 3s ease-out infinite}
@keyframes sm{0%{transform:translate(-50%,0) scale(.5);opacity:.6}100%{transform:translate(-50%,-130px) scale(2.4);opacity:0}}
.day{font-size:58px;font-weight:900;line-height:1;margin-top:6px;letter-spacing:-1px}
.day small{font-size:16px;font-weight:600;color:var(--mu);margin-left:4px;letter-spacing:0}
.name{color:var(--ac);font-weight:800;font-size:18px;margin:6px 0 2px;transition:color .8s}
.msg{color:var(--mu);font-size:13.5px;min-height:22px;font-style:italic}
.card{background:var(--card);border-radius:18px;padding:16px;margin:16px 0;border:1px solid rgba(255,255,255,0.05)}
.time{font-size:32px;font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:1px}
.lbl{font-size:12px;color:var(--mu);margin-top:2px}
button{width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:800;color:#120a00;background:var(--ac);cursor:pointer;transition:transform .1s,opacity .2s,box-shadow .2s;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
button:hover:not(:disabled){filter:brightness(1.1)}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.ms{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.chip{font-size:11px;padding:6px 10px;border-radius:999px;background:var(--card);color:var(--mu);border:1px solid #2a223a;font-weight:600}
.chip.on{color:#120a00;background:var(--ac);border-color:transparent;font-weight:800}
.bar{display:flex;gap:6px;justify-content:center;margin:12px 0 0}
.dot{width:28px;height:28px;border-radius:50%;background:#231b30;font-size:11px;display:grid;place-items:center;color:var(--mu);font-weight:700}
.dot.on{background:var(--ac);color:#120a00;font-weight:800;box-shadow:0 0 8px var(--ac)}
.store{margin-top:24px;font-size:11px;color:var(--mu);opacity:.7}
.best{font-size:12px;color:var(--mu);margin-top:10px;font-weight:600}
</style>
</head>
<body>
<main id="app">
  <h1>🔥 Check-in Harian buat streak</h1>
  <p class="sub">Jangan sampe oleng bray, urus apilu tiap hari!</p>

  <div class="fire" id="fire">
    <svg viewBox="0 0 100 130">
      <defs>
        <linearGradient id="g1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" id="s1a" stop-color="#555"/><stop offset="1" id="s1b" stop-color="#555"/></linearGradient>
        <linearGradient id="g2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" id="s2a" stop-color="#444"/><stop offset="1" id="s2b" stop-color="#444"/></linearGradient>
        <linearGradient id="g3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" id="s3a" stop-color="#333"/><stop offset="1" id="s3b" stop-color="#333"/></linearGradient>
      </defs>
      <path class="f f1" fill="url(#g1)" d="M50 2C58 28 88 44 88 84C88 110 71 127 50 127C29 127 12 110 12 84C12 58 34 48 40 22C44 31 47 34 50 2Z"/>
      <path class="f f2" fill="url(#g2)" d="M50 34C56 52 76 62 76 90C76 110 64 124 50 124C36 124 24 110 24 90C24 72 40 64 44 50C46 55 48 56 50 34Z"/>
      <path class="f f3" fill="url(#g3)" d="M50 70C54 82 64 88 64 102C64 114 58 122 50 122C42 122 36 114 36 102C36 92 46 86 50 70Z"/>
    </svg>
  </div>

  <div class="day" id="day">0<small>hari</small></div>
  <div class="name" id="name">Gelap Banget Jir</div>
  <div class="msg" id="msg"></div>

  <div class="card">
    <div class="time" id="time">--:--:--</div>
    <div class="lbl" id="lbl"></div>
  </div>

  <button id="btn">Gas Check-in!</button>

  <div class="bar" id="bar"></div>
  <div class="ms" id="ms"></div>
  <div class="best" id="best"></div>

  <div class="store">Powered by ®Lueel • V 1.2</div>
</main>

<script>
const KEY = "checkin_api_v1";
const H = 3600000, OPEN = 24 * H, DEAD = 48 * H;
let mem = null;

// Audio Effect Sederhana (Tanpa File Eksternal)
function playSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(300, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  } catch(e){}
}

function load() {
  try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {}
  return mem || { streak: 0, best: 0, last: 0, dead: false, lost: 0 };
}
function save() {
  mem = S;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  idbSet(S);
}
function idb() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open("checkin_api_db", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
function idbSet(v) {
  idb().then(db => { db.transaction("kv", "readwrite").objectStore("kv").put(v, KEY); }).catch(() => {});
}
function idbGet() {
  return idb().then(db => new Promise(res => {
    const q = db.transaction("kv").objectStore("kv").get(KEY);
    q.onsuccess = () => res(q.result || null);
    q.onerror = () => res(null);
  })).catch(() => null);
}
let S = load();

// Bahasa Gaul Level Api
const STAGES = [
  { min: 0,  n: "Gelap Banget jir 🌑",   c: ["#5a5566", "#47424f", "#37333f"], glow: "rgba(255,255,255,0)" },
  { min: 1,  n: "Bibit Api⚡",      c: ["#ff9a1f", "#ffc83d", "#fff3b0"], glow: "rgba(255,154,31,.18)" },
  { min: 3,  n: "Api-nya masih bocil🔥",       c: ["#ff6a00", "#ff9a1f", "#ffe08a"], glow: "rgba(255,106,0,.22)" },
  { min: 5,  n: "Gelo Membara💥",      c: ["#ff3b1f", "#ff7a1a", "#ffd36b"], glow: "rgba(255,59,31,.25)" },
  { min: 7,  n: "Asek👑",   c: ["#e01414", "#ff4a1a", "#ffb347"], glow: "rgba(224,20,20,.3)" },
  { min: 10, n: "Api Ungu bray 🔮",     c: ["#7a2cff", "#b46bff", "#f0d9ff"], glow: "rgba(122,44,255,.35)" },
  { min: 14, n: "Api Biru cuy💎",     c: ["#1f6bff", "#4fa3ff", "#d6ecff"], glow: "rgba(31,107,255,.35)" },
  { min: 21, n: "Api Tosca jir 🌊",    c: ["#00b3a4", "#2fe3cf", "#e0fffb"], glow: "rgba(0,179,164,.35)" },
  { min: 30, n: "Anjay 7 hari 🔱",    c: ["#ffb300", "#ffe566", "#ffffff"], glow: "rgba(255,200,0,.4)" }
];
const MILES = [7, 10, 14, 21, 30];

// Quotes Gaul Random saat locked / open
const QUOTES_OPEN = [
  "Cepat check-in bray, keburu padam entar!",
  "Gaskeun mumpung lapak masih buka!",
  "Api lu nungguin nih, jgn kasih kendor!"
];
const QUOTES_LOCKED = [
  "Aman bray, lu udah santuy hari ini.",
  "Rebahan dulu, besok kita racik lg apinya.",
  "Streak lu aman, tinggal ngopi dulu aja."
];

function stageOf(n) { let s = STAGES[0]; for (const x of STAGES) if (n >= x.min) s = x; return s; }
const $ = id => document.getElementById(id);
function pad(n) { return String(n).padStart(2, "0"); }
function fmt(ms) {
  ms = Math.max(0, ms);
  const s = Math.floor(ms / 1000);
  return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s % 3600 / 60)) + ":" + pad(s % 60);
}

function setFire(n, dead) {
  const st = dead ? STAGES[0] : stageOf(n);
  const r = document.documentElement.style;
  r.setProperty("--c1", st.c[0]); r.setProperty("--c2", st.c[1]); r.setProperty("--c3", st.c[2]);
  r.setProperty("--glow", st.glow);
  r.setProperty("--ac", dead || n === 0 ? "#ff9a1f" : st.c[1]);
  [["s1a", st.c[0]], ["s1b", st.c[1]], ["s2a", st.c[1]], ["s2b", st.c[2]], ["s3a", st.c[2]], ["s3b", "#ffffff"]].forEach(([id, c]) => {
    $(id).setAttribute("stop-color", dead ? (id[1] === "3" ? "#4a4555" : "#3a3544") : c);
  });
  if (dead) { $("s3b").setAttribute("stop-color", "#5a5566"); }
  const size = dead ? 0.55 : Math.min(1.45, 0.75 + Math.min(n, 30) * 0.023);
  $("fire").style.transform = "scale(" + size + ")";
  $("fire").style.marginTop = (size < 1 ? 10 : 10 + (size - 1) * 120) + "px";
  $("fire").style.marginBottom = (size > 1 ? (size - 1) * 30 : 0) + "px";
  $("fire").classList.toggle("dead", dead || n === 0);
  $("name").textContent = dead ? "Rungkad Padam Bro 💀" : st.n;
  $("name").style.color = dead ? "#9a8fb0" : st.c[1];

  const fx = $("fire");
  fx.querySelectorAll(".spark,.smoke").forEach(e => e.remove());
  if (dead) {
    for (let i = 0; i < 2; i++) { const m = document.createElement("div"); m.className = "smoke"; m.style.animationDelay = i * 1.5 + "s"; fx.appendChild(m); }
  } else if (n > 0) {
    const cnt = Math.min(16, 4 + n);
    for (let i = 0; i < cnt; i++) {
      const p = document.createElement("div"); p.className = "spark";
      p.style.setProperty("--dx", (Math.random() * 80 - 40) + "px");
      p.style.marginLeft = (Math.random() * 40 - 20) + "px";
      p.style.animationDelay = (Math.random() * 2.4) + "s";
      p.style.animationDuration = (1.8 + Math.random() * 1.4) + "s";
      fx.appendChild(p);
    }
  }
}

function renderStatic(dead) {
  $("day").innerHTML = (dead ? 0 : S.streak) + "<small>hari</small>";
  const wk = dead ? 0 : (S.streak === 0 ? 0 : ((S.streak - 1) % 7) + 1);
  $("bar").innerHTML = Array.from({ length: 7 }, (_, i) =>
    '<div class="dot' + (i < wk ? " on" : "") + '">' + (i + 1) + "</div>").join("");
  $("ms").innerHTML = MILES.map(m => '<span class="chip' + (!dead && S.streak >= m ? " on" : "") + '">' + m + " Hari</span>").join("");
  $("best").textContent = S.best > 0 ? "🔥 Rekor Terbaik Lu: " + S.best + " Hari" : "";
}

let lastKey = "";
function tick() {
  const now = Date.now();
  let mode; // new | locked | open | dead
  if (S.last === 0) mode = "new";
  else {
    const d = now - S.last;
    if (d >= DEAD) { if (!S.dead) { S.dead = true; S.lost = S.streak; S.streak = 0; save(); } mode = "dead"; }
    else if (S.dead) mode = "dead";
    else mode = d >= OPEN ? "open" : "locked";
  }
  const dead = mode === "dead";
  const key = mode + S.streak;
  if (key !== lastKey) { 
    lastKey = key; 
    setFire(S.streak, dead); 
    renderStatic(dead); 

    // Ganti kata gaul sesuai mode
    if (mode === "new") {
      $("msg").textContent = "Nyalain apilu sekarang bray!";
    } else if (mode === "locked") {
      $("msg").textContent = QUOTES_LOCKED[Math.floor(Math.random() * QUOTES_LOCKED.length)];
    } else if (mode === "open") {
      $("msg").textContent = QUOTES_OPEN[Math.floor(Math.random() * QUOTES_OPEN.length)];
    } else {
      $("msg").textContent = "Lambat bgt jir, mulai dr nol lg deh!";
    }
  }

  const btn = $("btn");
  if (mode === "new") {
    btn.disabled = false; btn.textContent = "🔥 Start Perjalanan!";
    $("time").textContent = "GAS!"; $("lbl").textContent = "Hari ke-1, nyalain kompor lu";
  } else if (mode === "locked") {
    btn.disabled = true; btn.textContent = "Udah Absen Bro, Santuy Dulu!";
    $("time").textContent = fmt(S.last + OPEN - now); $("lbl").textContent = "hitung mundur absen berikutnya";
  } else if (mode === "open") {
    btn.disabled = false; btn.textContent = "⚡ Check-in Hari Ke-" + (S.streak + 1);
    $("time").textContent = fmt(S.last + DEAD - now); $("lbl").textContent = "sebelum mati total bray";
  } else {
    btn.disabled = false; btn.textContent = "🔄 Nyalain Lagi (Hari 1)";
    $("time").textContent = "PADAM"; $("lbl").textContent = "streak " + S.lost + " hari lu hangus!";
  }
}

$("btn").onclick = () => {
  playSound();
  const now = Date.now();
  if (S.last === 0 || S.dead) {
    S = { streak: 1, best: Math.max(S.best, 1), last: now, dead: false, lost: 0 };
  } else if (now - S.last >= OPEN) {
    S.streak += 1; S.best = Math.max(S.best, S.streak); S.last = now;
  } else return;
  save(); lastKey = ""; tick();
};

tick();
setInterval(tick, 1000);
idbGet().then(d => {
  if (d && d.last > S.last) {
    S = d; mem = S;
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    lastKey = ""; tick();
  }
});
</script>
</body>
</html>
